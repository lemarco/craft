# Benchmarks + soak harness (backlog T10, testing-strategy). Deliberately a standalone
# crate *outside* the main workspace (its own [workspace] table + excluded by the
# root manifest) so criterion never compiles in the fast CI lane. Run with
# `cargo bench` / `cargo run --release --bin soak` from this directory.
# Queue hotspot: `cargo bench --bench queue`, `SOAK_QUEUE_SECS=60 cargo run --release --bin soak_queue`.
# Scenario soaks (B-10): `soak_actor_store`, `soak_saga`, `soak_session` — see docs/testing-coverage.md.
[package]
name = "trembita-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
trembita-core = { path = "../crates/trembita-core" }
trembita-storage = { path = "../crates/trembita-storage" }
trembita-actor = { path = "../crates/trembita-actor" }
trembita-proto = { path = "../crates/trembita-proto" }
trembita-sim = { path = "../crates/trembita-sim" }
trembita = { path = "../crates/trembita" }
trembita-test-support = { path = "../crates/trembita-test-support", features = ["facade"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "soak"
path = "src/bin/soak.rs"

[[bin]]
name = "soak_multi_raft"
path = "src/bin/soak_multi_raft.rs"

[[bin]]
name = "soak_queue"
path = "src/bin/soak_queue.rs"

[[bin]]
name = "soak_actor_store"
path = "src/bin/soak_actor_store.rs"

[[bin]]
name = "soak_saga"
path = "src/bin/soak_saga.rs"

[[bin]]
name = "soak_session"
path = "src/bin/soak_session.rs"

[[bench]]
name = "append"
harness = false

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "deliver"
harness = false

[[bench]]
name = "queue"
harness = false
