# Benchmarks + soak harness (backlog T10, testing-strategy). Deliberately a standalone
# crate *outside* the main workspace (its own [workspace] table + excluded by the
# root manifest) so criterion never compiles in the fast CI lane. Run with
# `cargo bench` / `cargo run --release --bin soak` from this directory.
# Queue hotspot: `cargo bench --bench queue`, `SOAK_QUEUE_SECS=60 cargo run --release --bin soak_queue`.
[package]
name = "craft-benchmarks"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
craft-core = { path = "../crates/craft-core" }
craft-storage = { path = "../crates/craft-storage" }
craft-actor = { path = "../crates/craft-actor" }
craft-proto = { path = "../crates/craft-proto" }
craft-sim = { path = "../crates/craft-sim" }
craft = { path = "../crates/craft" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "soak"
path = "src/bin/soak.rs"

[[bin]]
name = "soak_multi_raft"
path = "src/bin/soak_multi_raft.rs"

[[bin]]
name = "soak_queue"
path = "src/bin/soak_queue.rs"

[[bench]]
name = "append"
harness = false

[[bench]]
name = "apply"
harness = false

[[bench]]
name = "deliver"
harness = false

[[bench]]
name = "queue"
harness = false
