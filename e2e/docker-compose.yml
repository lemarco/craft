# A 3-node crafty cluster over real QUIC + mTLS (backlog T8).
#
# `certgen` mints a shared cluster CA + one cert per node (and node 4 for the
# linclient / queueclient mTLS identity) into a shared volume, then the three
# nodes boot and elect a leader. Peers address each other by service DNS name;
# mTLS still validates each peer against `crafty-node-<id>` (the cert SAN).
#
# Bring it up with `./e2e/run.sh` (election + failover) or `./e2e/queue.sh`
# (job queue over QUIC). Linearizability phase 2 runs `linclient`
# (`crafty-e2e-client`) on profile `linclient` — see `./e2e/linearizability.sh`.

x-node-build: &node-build
  build:
    context: ..
    dockerfile: e2e/Dockerfile

x-node-queue-env: &node-queue-env
  CRAFTY_DATA_DIR: /data
  CRAFTY_JOB_QUEUE: jobs

services:
  certgen:
    <<: *node-build
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /certs/ca.pem ]; then
          /app/generate.sh --ca-only --out /certs
          for id in 1 2 3 4; do
            /app/generate.sh --node-id "$$id" --out /certs \
              --ca /certs/ca.pem --ca-key /certs/ca.key
          done
        fi
        echo "certs ready:"; ls -1 /certs
    volumes:
      - certs:/certs

  node1:
    <<: *node-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-queue-env
      CRAFTY_NODE_ID: "1"
      CRAFTY_LISTEN: "0.0.0.0:7443"
      CRAFTY_ADMIN: "0.0.0.0:8080"
      CRAFTY_PEERS: "1@node1:7443,2@node2:7443,3@node3:7443"
      CRAFTY_CA_CERT: /certs/ca.pem
      CRAFTY_NODE_CERT: /certs/node-1.pem
      CRAFTY_NODE_KEY: /certs/node-1.key
      CRAFTY_CERT_WATCH_SECS: "${CRAFTY_CERT_WATCH_SECS:-60}"
    volumes:
      - certs:/certs
      - node1-data:/data
    ports:
      - "18081:8080"

  node2:
    <<: *node-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-queue-env
      CRAFTY_NODE_ID: "2"
      CRAFTY_LISTEN: "0.0.0.0:7443"
      CRAFTY_ADMIN: "0.0.0.0:8080"
      CRAFTY_PEERS: "1@node1:7443,2@node2:7443,3@node3:7443"
      CRAFTY_CA_CERT: /certs/ca.pem
      CRAFTY_NODE_CERT: /certs/node-2.pem
      CRAFTY_NODE_KEY: /certs/node-2.key
      CRAFTY_CERT_WATCH_SECS: "${CRAFTY_CERT_WATCH_SECS:-60}"
    volumes:
      - certs:/certs
      - node2-data:/data
    ports:
      - "18082:8080"

  node3:
    <<: *node-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-queue-env
      CRAFTY_NODE_ID: "3"
      CRAFTY_LISTEN: "0.0.0.0:7443"
      CRAFTY_ADMIN: "0.0.0.0:8080"
      CRAFTY_PEERS: "1@node1:7443,2@node2:7443,3@node3:7443"
      CRAFTY_CA_CERT: /certs/ca.pem
      CRAFTY_NODE_CERT: /certs/node-3.pem
      CRAFTY_NODE_KEY: /certs/node-3.key
      CRAFTY_CERT_WATCH_SECS: "${CRAFTY_CERT_WATCH_SECS:-60}"
      CRAFTY_ALLOW_LEAVE: "1"
      CRAFTY_GRACEFUL_LEAVE: "1"
    volumes:
      - certs:/certs
      - node3-data:/data
    ports:
      - "18083:8080"

  # One-shot QUIC load generator + external linearizability checker (phase 2).
  linclient:
    <<: *node-build
    depends_on:
      node1:
        condition: service_started
      node2:
        condition: service_started
      node3:
        condition: service_started
    entrypoint: ["/usr/local/bin/crafty-e2e-client"]
    environment:
      CRAFTY_NODE_ID: "4"
      CRAFTY_PEERS: "1@node1:7443,2@node2:7443,3@node3:7443"
      CRAFTY_CA_CERT: /certs/ca.pem
      CRAFTY_NODE_CERT: /certs/node-4.pem
      CRAFTY_NODE_KEY: /certs/node-4.key
      CRAFTY_LIN_ROUNDS: "${CRAFTY_LIN_ROUNDS:-6}"
    volumes:
      - certs:/certs
    profiles: ["linclient"]
    restart: "no"

  # One-shot QUIC job queue client (`e2e/queue.sh`).
  queueclient:
    <<: *node-build
    depends_on:
      node1:
        condition: service_started
      node2:
        condition: service_started
      node3:
        condition: service_started
    entrypoint: ["/usr/local/bin/crafty-e2e-queue-client"]
    environment:
      CRAFTY_NODE_ID: "4"
      CRAFTY_PEERS: "1@node1:7443,2@node2:7443,3@node3:7443"
      CRAFTY_CA_CERT: /certs/ca.pem
      CRAFTY_NODE_CERT: /certs/node-4.pem
      CRAFTY_NODE_KEY: /certs/node-4.key
      CRAFTY_JOB_QUEUE: jobs
      CRAFTY_QUEUE_SUBMIT_NODE: "1"
      CRAFTY_QUEUE_WORKER_PEER: "2"
      CRAFTY_QUEUE_WORKER_NODE: "2"
      CRAFTY_QUEUE_WORKER_INSTANCE: "1"
      CRAFTY_E2E_QUEUE_PHASE: "${CRAFTY_E2E_QUEUE_PHASE:-before_failover}"
      CRAFTY_QUEUE_CONTACT_NODE: "${CRAFTY_QUEUE_CONTACT_NODE:-1}"
    volumes:
      - certs:/certs
    profiles: ["queueclient"]
    restart: "no"

volumes:
  certs: {}
  node1-data: {}
  node2-data: {}
  node3-data: {}
