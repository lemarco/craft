# A 3-node craft cluster over real QUIC + mTLS (backlog T8).
#
# `certgen` mints a shared cluster CA + one cert per node into a shared volume,
# then the three nodes boot and elect a leader. Peers address each other by
# service DNS name; mTLS still validates each node against `craft-node-<id>`
# (the cert SAN), independent of the container hostname.
#
# Bring it up with `./e2e/run.sh` (which also asserts election + failover).

x-node-build: &node-build
  build:
    context: ..
    dockerfile: e2e/Dockerfile

services:
  certgen:
    <<: *node-build
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /certs/ca.pem ]; then
          /app/generate.sh --ca-only --out /certs
          for id in 1 2 3; do
            /app/generate.sh --node-id "$$id" --out /certs \
              --ca /certs/ca.pem --ca-key /certs/ca.key
          done
        fi
        echo "certs ready:"; ls -1 /certs
    volumes:
      - certs:/certs

  node1:
    <<: *node-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      CRAFT_NODE_ID: "1"
      CRAFT_LISTEN: "0.0.0.0:7443"
      CRAFT_ADMIN: "0.0.0.0:8080"
      CRAFT_PEERS: "1@node1:7443,2@node2:7443,3@node3:7443"
      CRAFT_CA_CERT: /certs/ca.pem
      CRAFT_NODE_CERT: /certs/node-1.pem
      CRAFT_NODE_KEY: /certs/node-1.key
      CRAFT_CERT_WATCH_SECS: "${CRAFT_CERT_WATCH_SECS:-60}"
    volumes:
      - certs:/certs
    ports:
      - "18081:8080"

  node2:
    <<: *node-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      CRAFT_NODE_ID: "2"
      CRAFT_LISTEN: "0.0.0.0:7443"
      CRAFT_ADMIN: "0.0.0.0:8080"
      CRAFT_PEERS: "1@node1:7443,2@node2:7443,3@node3:7443"
      CRAFT_CA_CERT: /certs/ca.pem
      CRAFT_NODE_CERT: /certs/node-2.pem
      CRAFT_NODE_KEY: /certs/node-2.key
      CRAFT_CERT_WATCH_SECS: "${CRAFT_CERT_WATCH_SECS:-60}"
    volumes:
      - certs:/certs
    ports:
      - "18082:8080"

  node3:
    <<: *node-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      CRAFT_NODE_ID: "3"
      CRAFT_LISTEN: "0.0.0.0:7443"
      CRAFT_ADMIN: "0.0.0.0:8080"
      CRAFT_PEERS: "1@node1:7443,2@node2:7443,3@node3:7443"
      CRAFT_CA_CERT: /certs/ca.pem
      CRAFT_NODE_CERT: /certs/node-3.pem
      CRAFT_NODE_KEY: /certs/node-3.key
      CRAFT_CERT_WATCH_SECS: "${CRAFT_CERT_WATCH_SECS:-60}"
    volumes:
      - certs:/certs
    ports:
      - "18083:8080"

volumes:
  certs: {}
