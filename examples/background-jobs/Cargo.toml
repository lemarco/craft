# Background jobs showcase — jobs: HTTP 202 → durable queue → worker.
#
#   cargo run --release          # terminal 1 — gateway + consumer
#   ./trigger.sh welcome-user-42 # terminal 2
[package]
name = "trembita-showcase-background-jobs"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
trembita = { path = "../../crates/trembita", features = ["http-jobs"] }
trembita-runtime = { path = "../../crates/trembita-runtime" }
trembita-tools = { path = "../../crates/trembita-tools" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1"
