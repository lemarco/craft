[package]
name = "crafty-showcase-workflows"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
crafty = { path = "../../crates/crafty" }
crafty-client = { path = "../../crates/crafty-client" }
crafty-http = { path = "../../crates/crafty-http" }
crafty-net = { path = "../../crates/crafty-net" }
crafty-showcase-common = { path = "../../crates/crafty-showcase-common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
