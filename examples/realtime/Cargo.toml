# Real-time sessions showcase — actors: WebSocket gateway + sticky `ActorSession`.
#
#   cargo run --release          # gateway + chat workers (local demo)
#   ./trigger.sh alice hello     # send one WS message (needs websocat)
[package]
name = "trembita-showcase-realtime"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
trembita = { path = "../../crates/trembita", features = ["http-jobs"] }
trembita-actor = { path = "../../crates/trembita-actor" }
trembita-showcase-common = { path = "../../crates/trembita-showcase-common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
axum = { version = "0.8", features = ["json", "ws"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
