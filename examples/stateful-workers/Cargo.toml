# Stateful workers showcase — orders capability (ActorStateStore) + migration demo.
#
#   cargo run --release              # HTTP server + idempotent orders
#   cargo run --release migrate-demo # two-node migration walkthrough
#   ./trigger.sh 1001
[package]
name = "trembita-showcase-stateful-workers"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
trembita = { path = "../../crates/trembita", features = ["http-jobs"] }
trembita-runtime = { path = "../../crates/trembita-runtime" }
trembita-tools = { path = "../../crates/trembita-tools" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
