# Stateful workers showcase — tier B: ActorStateStore + migration.
#
#   cargo run --release              # HTTP server + idempotent orders
#   cargo run --release migrate-demo # two-node migration walkthrough
#   ./trigger.sh 1001
[package]
name = "crafty-showcase-stateful-workers"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
crafty = { path = "../../crates/crafty", features = ["http-jobs"] }
crafty-actor = { path = "../../crates/crafty-actor" }
crafty-showcase-client = { path = "../../crates/crafty-showcase-client" }
crafty-showcase-common = { path = "../../crates/crafty-showcase-common" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
