# Stateful workers showcase — actors: ActorStateStore + migration.
#
#   cargo run --release              # HTTP server + idempotent orders
#   cargo run --release migrate-demo # two-node migration walkthrough
#   ./trigger.sh 1001
[package]
name = "trembita-showcase-stateful-workers"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
trembita = { path = "../../crates/trembita", features = ["http-jobs"] }
trembita-actor = { path = "../../crates/trembita-actor" }
trembita-showcase-client = { path = "../../crates/trembita-showcase-client" }
trembita-showcase-common = { path = "../../crates/trembita-showcase-common" }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
