# Lefthook v2 — local quality gates aligned with ci-fast-lane.sh (library-and-publishing).
#
# Setup (once per clone):
#   lefthook install
#
# Bypass:  LEFTHOOK=0 git commit|push …
# Log:     CRAFTY_HOOK_LOG=1 git push
# Release: lefthook run pre-push --tags release
# No autofix commit on push: CRAFTY_NO_AUTOFIX_COMMIT=1 git push

min_version: '1.12.0'

pre-commit:
  jobs:
    - name: gate-commit
      glob: '*.{rs,toml,lock,md}'
      fail_text: |
        commit gate failed. Fix manually or run:
          ./scripts/gate.sh --tier commit --staged-only --stage
      run: bash scripts/gate.sh --tier commit --staged-only
      stage_fixed: true

    - name: shellcheck
      glob: '*.sh'
      fail_text: |
        shellcheck failed. Fix staged scripts or run:
          bash scripts/check-shell-scripts.sh
      run: bash scripts/check-shell-scripts.sh {staged_files}

pre-push:
  jobs:
    - name: quality-full
      fail_text: |
        Pre-push gate failed. Re-run:
          ./scripts/gate.sh --tier push
        With autofix commit disabled:
          CRAFTY_NO_AUTOFIX_COMMIT=1 git push
        With log:
          CRAFTY_HOOK_LOG=1 git push
      run: CRAFTY_GATE_AUTOFIX=1 CRAFTY_AUTOFIX_COMMIT=1 bash scripts/gate.sh --tier push

    - name: release-build
      tags: [release]
      fail_text: |
        Release build failed. Run:
          bash scripts/gate.sh --tier push --release-build
      run: bash scripts/gate.sh --tier push --release-build

commit-msg:
  jobs:
    - name: conventional-commit
      run: bash scripts/check-commit-msg.sh {1}

post-merge:
  jobs:
    - name: hooks
      run: lefthook install

post-checkout:
  jobs:
    - name: hooks
      run: lefthook install
