# Lefthook v2 — local quality gates aligned with .gitlab-ci.yml fast lane (library-and-publishing, testing-strategy).
#
# Setup (once per clone):
#   lefthook install
#
# lefthook v2 skips jobs unless {staged_files} appears in `run`.
# _LH='{staged_files}' forces workspace-wide Rust gates on every commit.
#
# Bypass:  LEFTHOOK=0 git commit|push …
# Log:     CRAFT_HOOK_LOG=1 git push

min_version: '1.6.0'

env:
  PATH: '$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH'
  RUSTFLAGS: '-D warnings'

pre-commit:
  jobs:
    # ── Phase 1: static checks (parallel) ─────────────────────────────────────
    - name: static
      group:
        parallel: true
        jobs:
          - name: cargo-fmt
            run: |
              # {staged_files}
              source scripts/hook-prelude.sh
              cargo fmt --all -- --check

          - name: shellcheck
            run: |
              # {staged_files}
              bash scripts/check-shell-scripts.sh

          - name: cargo-doc
            run: |
              # {staged_files}
              source scripts/hook-prelude.sh
              RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

    # ── Phase 2: compile + lint (sequential) ──────────────────────────────────
    - name: rust
      group:
        piped: true
        jobs:
          - name: cargo-clippy
            run: |
              # {staged_files}
              source scripts/hook-prelude.sh
              cargo clippy --workspace --all-targets --all-features -- -D warnings

          - name: cargo-check
            run: |
              # {staged_files}
              source scripts/hook-prelude.sh
              cargo check --workspace --all-features

pre-push:
  jobs:
    - name: quality-full
      group:
        piped: true
        jobs:
          - name: cargo-check
            run: |
              # {push_files}
              source scripts/hook-prelude.sh
              cargo check --workspace --all-features

          - name: cargo-test
            run: |
              # {push_files}
              source scripts/hook-prelude.sh
              if command -v cargo-nextest >/dev/null 2>&1; then
                cargo nextest run --workspace --all-features
              else
                cargo test --workspace --all-features
              fi

          - name: cargo-doctest
            run: |
              # {push_files}
              source scripts/hook-prelude.sh
              cargo test --workspace --doc --all-features

          - name: cargo-build-release
            run: |
              # {push_files}
              source scripts/hook-prelude.sh
              cargo build --workspace --all-features --release

commit-msg:
  jobs:
    - name: conventional-commit
      run: bash scripts/check-commit-msg.sh {1}

post-merge:
  jobs:
    - name: hooks
      run: lefthook install

post-checkout:
  jobs:
    - name: hooks
      run: lefthook install
