# Lefthook v2 — local quality gates aligned with ci-fast-lane.sh (library-and-publishing).
#
# Setup (once per clone):
#   lefthook install
#
# Bypass:  LEFTHOOK=0 git commit|push …
# Log:     CRAFTY_HOOK_LOG=1 git push
# Release: lefthook run pre-push --tags release
# No autofix commit on push: CRAFTY_NO_AUTOFIX_COMMIT=1 git push

min_version: '1.12.0'

# Plain streaming output — no spinner that hides cargo progress for minutes.
no_tty: true

output:
  - execution
  - execution_out
  - execution_info
  - failure
  - summary

pre-commit:
  jobs:
    - name: gate-commit
      glob: '*.{rs,toml,lock,md}'
      fail_text: |
        commit gate failed. Fix manually or run:
          ./scripts/gate.sh --tier commit --staged-only --stage
      run: bash scripts/gate.sh --tier commit --staged-only
      stage_fixed: true

    - name: shellcheck
      glob: '*.sh'
      fail_text: |
        shellcheck failed. Fix staged scripts or run:
          bash scripts/check-shell-scripts.sh
      run: bash scripts/check-shell-scripts.sh {staged_files}

pre-push:
  piped: true
  jobs:
    - name: autofix
      run: CRAFTY_GATE_AUTOFIX=1 CRAFTY_AUTOFIX_COMMIT=1 bash scripts/gate-step.sh autofix

    - name: fmt
      run: bash scripts/gate-step.sh fmt

    - name: clippy
      run: bash scripts/gate-step.sh clippy

    - name: tests
      run: bash scripts/gate-step.sh tests

    - name: doctests
      run: bash scripts/gate-step.sh doctests

    - name: doc
      run: bash scripts/gate-step.sh doc

    - name: shellcheck
      run: bash scripts/gate-step.sh shellcheck

    - name: doc-links
      run: bash scripts/gate-step.sh doc-links

    - name: publish-dry-run
      run: bash scripts/gate-step.sh publish-dry-run

    - name: examples
      run: bash scripts/gate-step.sh examples

    - name: showcase
      run: bash scripts/gate-step.sh showcase

    - name: msrv
      run: bash scripts/gate-step.sh msrv

    - name: release-build
      tags: [release]
      run: bash scripts/gate-step.sh release-build

commit-msg:
  jobs:
    - name: conventional-commit
      run: bash scripts/check-commit-msg.sh {1}

post-merge:
  jobs:
    - name: hooks
      run: lefthook install

post-checkout:
  jobs:
    - name: hooks
      run: lefthook install
