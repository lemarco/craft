# Lefthook v2 — local quality gates aligned with .gitlab-ci.yml fast lane (library-and-publishing, testing-strategy).
#
# Setup (once per clone):
#   lefthook install
#
# lefthook v2 skips jobs unless {staged_files} appears in `run` (or `glob` is set).
# Jobs with `glob` run only when matching paths are staged/pushed.
#
# Bypass:  LEFTHOOK=0 git commit|push …
# Log:     CRAFTY_HOOK_LOG=1 git push
# Release: lefthook run pre-push --tags release

min_version: '1.12.0'

pre-commit:
  jobs:
    - name: cargo-fmt
      fail_text: |
        rustfmt check failed — workspace is not formatted. Fix with:
          ./scripts/gate-fmt.sh
          git add -u
      run: bash scripts/gate-fmt.sh --check

    - name: shellcheck
      glob: '*.sh'
      fail_text: |
        shellcheck failed. Fix staged scripts or run:
          bash scripts/check-shell-scripts.sh
      run: bash scripts/check-shell-scripts.sh {staged_files}

    - name: clippy
      glob: '*.{rs,toml,lock}'
      fail_text: |
        clippy failed. Fix warnings or run:
          ./scripts/quality-gate-pre-commit.sh
      run: bash scripts/gate-clippy.sh

pre-push:
  jobs:
    - name: quality-full
      fail_text: |
        Pre-push gate failed. Re-run:
          ./scripts/quality-gate-pre-push.sh
        With log:
          CRAFTY_HOOK_LOG=1 git push
      run: bash scripts/quality-gate-pre-push.sh

    - name: release-build
      tags: [release]
      fail_text: |
        Release build failed. Run:
          cargo build --workspace --all-features --release
      run: |
        source scripts/hook-prelude.sh
        cargo build --workspace --all-features --release

commit-msg:
  jobs:
    - name: conventional-commit
      run: bash scripts/check-commit-msg.sh {1}

post-merge:
  jobs:
    - name: hooks
      run: lefthook install

post-checkout:
  jobs:
    - name: hooks
      run: lefthook install
