# GitLab CI for trembita (testing-strategy: fast lane on every push/MR, heavy lane nightly).

stages:
  - check
  - heavy
  - release

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: "off"
  NEXTEST_PROFILE: ci

.rust_linux_linker:
  before_script:
    - bash scripts/ci-linux-linker-deps.sh

.rust_fast_lane_setup:
  before_script:
    - !reference [.rust_linux_linker, before_script]
    - rustup component add rustfmt clippy
    - mkdir -p "$CARGO_HOME/bin" && curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "$CARGO_HOME/bin"
    - bash scripts/ci-dns-localhost.sh

.run-heavy-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /run-heavy/

default:
  image: rust:latest
  before_script:
    - !reference [.rust_linux_linker, before_script]
  cache:
    key:
      files:
        - Cargo.lock
      prefix: ci-slim-v1
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

# --- Fast lane — runs on every branch push and merge request -----------------
fast:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - !reference [.rust_fast_lane_setup, before_script]
  script:
    - df -h .
    - TREMBITA_CI_DISK_PRUNE=1 bash scripts/ci-fast-lane.sh

# --- Minimum Supported Rust Version check (library-and-publishing) --------------------------
msrv:
  stage: check
  image: rust:1.90
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - !reference [.rust_linux_linker, before_script]
  script:
    - cargo check --workspace --all-features

fuzz:
  stage: heavy
  image: rustlang/rust:nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.rust_linux_linker, before_script]
  script:
    - cargo install cargo-fuzz
    - cd crates/trembita-fuzz && cargo fuzz run wire_decode -- -max_total_time=300

e2e:
  stage: heavy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TREMBITA_E2E_HOST: "docker"
  rules:
    - !reference [.run-heavy-rules, rules]
  before_script:
    - apk add --no-cache bash curl
  script:
    - bash e2e/run.sh
    - bash e2e/leave.sh
    - bash e2e/queue.sh
    - bash e2e/chaos.sh
    - bash e2e/cert_renew.sh
    - TREMBITA_LINEARIZABILITY_SKIP_SIM=1 TREMBITA_E2E_LINEARIZABILITY=1 bash e2e/linearizability.sh

linearizability-sim:
  stage: heavy
  image: rust:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - TREMBITA_E2E_LINEARIZABILITY=0 bash e2e/linearizability.sh

store-redis:
  stage: heavy
  image: rust:latest
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  rules:
    - !reference [.run-heavy-rules, rules]
  script:
    - cargo test -p trembita-store-redis --features docker-tests -- --ignored

bench:
  stage: heavy
  image: rust:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo bench --manifest-path benchmarks/Cargo.toml
    - SOAK_SECS=120 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak
    - SOAK_MULTI_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_multi_raft
    - SOAK_QUEUE_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_queue
    - SOAK_ACTOR_STORE_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_actor_store
    - SOAK_SAGA_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_saga
    - SOAK_SESSION_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_session

# --- Publish (library-and-publishing) ----------------------------------------
# Tag pipelines skip branch fast lane; run the full ci-fast-lane before publish.
publish-dry-run:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    - !reference [.rust_fast_lane_setup, before_script]
  script:
    - TREMBITA_CI_DISK_PRUNE=1 bash scripts/ci-fast-lane.sh

publish:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
      when: manual
  before_script:
    - !reference [.rust_linux_linker, before_script]
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - ./scripts/publish-workspace.sh "$VERSION"
    - ./scripts/post-publish-docs.sh "$VERSION"
  artifacts:
    when: always
    paths:
      - README.md
      - docs/status.md
    expire_in: 30 days
