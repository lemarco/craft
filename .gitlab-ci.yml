# GitLab CI for trembita — production library pipeline.
#
# Lanes:
#   check  — every MR / branch push (fast lane, msrv, website build)
#   heavy  — nightly schedule or MR label run-heavy
#   release — version tags: gate → release build → manual crates.io publish
#   deploy — GitLab Pages (master + release tags)
#
# Local dev is unchanged: [profile.dev] in Cargo.toml + unpacked debuginfo.
# CI-only tuning lives in scripts/ci-env.sh and CARGO_PROFILE_DEV_* below.

stages:
  - check
  - heavy
  - release
  - deploy

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  # saas-linux-small (~26G): disable unpacked debuginfo so target/ fits on disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: "off"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  NEXTEST_PROFILE: ci
  TREMBITA_DEFAULT_BRANCH: "master"
  # sccache (forced by .cargo/config.toml rustc-wrapper) — small disk budget on CI.
  SCCACHE_DIR: "$CI_PROJECT_DIR/.sccache"
  SCCACHE_CACHE_SIZE: "2G"
  RUSTC_WRAPPER: sccache
  SCCACHE_VERSION: "0.17.0"

.rules_branch_mr:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH

.rules_master:
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

.rules_release_tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

.run-heavy-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /run-heavy/

.rust_linux_linker:
  before_script:
    - bash scripts/ci-linux-linker-deps.sh

.rust_ci_setup:
  before_script:
    - bash scripts/ci-env.sh
    - bash scripts/ci-sccache.sh
    - !reference [.rust_linux_linker, before_script]

.rust_fast_lane_setup:
  before_script:
    - !reference [.rust_ci_setup, before_script]
    - rustup component add rustfmt clippy
    - mkdir -p "$CARGO_HOME/bin" && curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "$CARGO_HOME/bin"
    - bash scripts/ci-dns-localhost.sh

.rust_registry_cache:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: cargo-registry-sccache-v1
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - .sccache/
    policy: pull-push

# --- Check lane (every MR / branch push) -------------------------------------

fast:
  stage: check
  extends: .rust_registry_cache
  rules:
    - !reference [.rules_branch_mr, rules]
  before_script:
    - !reference [.rust_fast_lane_setup, before_script]
  script:
    - df -h .
    - TREMBITA_CI_DISK_PRUNE=1 bash scripts/ci-fast-lane.sh
  after_script:
    - export PATH="${CARGO_HOME}/bin:${PATH}"
    - sccache --show-stats || true

msrv:
  stage: check
  image: rust:1.94
  extends: .rust_registry_cache
  rules:
    - !reference [.rules_branch_mr, rules]
  before_script:
    - !reference [.rust_ci_setup, before_script]
  script:
    - cargo check --workspace --all-features

website-check:
  stage: check
  image: node:22-bookworm
  rules:
    - !reference [.rules_branch_mr, rules]
  cache:
    key:
      files:
        - website/package-lock.json
      prefix: website-npm-v1
    paths:
      - website/node_modules/
    policy: pull-push
  script:
    - bash scripts/gate-website.sh

# --- Heavy lane (nightly or MR label run-heavy) --------------------------------

fuzz:
  stage: heavy
  image: rustlang/rust:nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.rust_ci_setup, before_script]
  script:
    - cargo install cargo-fuzz
    - cd crates/trembita-fuzz && cargo fuzz run wire_decode -- -max_total_time=300

e2e:
  stage: heavy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TREMBITA_E2E_HOST: "docker"
  rules:
    - !reference [.run-heavy-rules, rules]
  before_script:
    - apk add --no-cache bash curl
  script:
    - bash e2e/run.sh
    - bash e2e/leave.sh
    - bash e2e/queue.sh
    - bash e2e/chaos.sh
    - bash e2e/cert_renew.sh
    - TREMBITA_LINEARIZABILITY_SKIP_SIM=1 TREMBITA_E2E_LINEARIZABILITY=1 bash e2e/linearizability.sh

linearizability-sim:
  stage: heavy
  image: rust:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.rust_ci_setup, before_script]
  script:
    - TREMBITA_E2E_LINEARIZABILITY=0 bash e2e/linearizability.sh

store-redis:
  stage: heavy
  image: rust:latest
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  rules:
    - !reference [.run-heavy-rules, rules]
  before_script:
    - !reference [.rust_ci_setup, before_script]
  script:
    - cargo test -p trembita-store-redis --features docker-tests -- --ignored
    - cargo test -p trembita-capstore-postgres --features docker-tests -- --ignored

bench:
  stage: heavy
  image: rust:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - !reference [.rust_ci_setup, before_script]
  script:
    - cargo bench --manifest-path benchmarks/Cargo.toml
    - SOAK_SECS=120 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak
    - SOAK_MULTI_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_multi_raft
    - SOAK_QUEUE_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_queue
    - SOAK_ACTOR_STORE_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_actor_store
    - SOAK_SAGA_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_saga
    - SOAK_SESSION_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_session

# --- Release lane (version tags vX.Y.Z) --------------------------------------
# Tag push → publish-dry-run (full gate) → release-build → manual publish.
# Set CARGO_REGISTRIES_CRATES_IO_TOKEN in GitLab CI/CD variables (masked).

publish-dry-run:
  stage: release
  extends: .rust_registry_cache
  rules:
    - !reference [.rules_release_tag, rules]
  before_script:
    - !reference [.rust_fast_lane_setup, before_script]
  script:
    - TREMBITA_CI_DISK_PRUNE=1 bash scripts/ci-fast-lane.sh

release-build:
  stage: release
  extends: .rust_registry_cache
  rules:
    - !reference [.rules_release_tag, rules]
  needs:
    - publish-dry-run
  before_script:
    - !reference [.rust_ci_setup, before_script]
  script:
    - cargo build --workspace --all-features --release
    - cargo build -p trembita-tools --release --bin trembita-showcase-client

publish:
  stage: release
  extends: .rust_registry_cache
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
      when: manual
  needs:
    - publish-dry-run
    - release-build
  before_script:
    - !reference [.rust_ci_setup, before_script]
  script:
    - |
      if [ -z "${CARGO_REGISTRIES_CRATES_IO_TOKEN:-}" ]; then
        echo "error: set CARGO_REGISTRIES_CRATES_IO_TOKEN in GitLab CI/CD variables" >&2
        exit 1
      fi
    - VERSION="${CI_COMMIT_TAG#v}"
    - ./scripts/publish-workspace.sh "$VERSION"
    - ./scripts/post-publish-docs.sh "$VERSION"
  artifacts:
    when: always
    paths:
      - README.md
      - docs/status.md
    expire_in: 30 days

# --- Deploy lane (GitLab Pages → trembita.dev) ---------------------------------

pages:
  stage: deploy
  image: node:22-bookworm
  rules:
    - !reference [.rules_master, rules]
    - !reference [.rules_release_tag, rules]
  needs:
    - job: publish-dry-run
      optional: true
  cache:
    key:
      files:
        - website/package-lock.json
      prefix: website-npm-v1
    paths:
      - website/node_modules/
    policy: pull
  script:
    - bash scripts/gate-website.sh
    - mv website/.vitepress/dist public
  artifacts:
    paths:
      - public
