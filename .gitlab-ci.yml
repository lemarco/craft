# GitLab CI for craft (testing-strategy: fast lane on every push/MR, heavy lane nightly).

stages:
  - check
  - heavy
  - release

variables:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # Keep cargo's registry/build output inside the project so it can be cached.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  image: rust:latest
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/registry/index/
      - .cargo/registry/cache/
      - .cargo/git/db/
      - target/

# --- Fast lane — runs on every branch push and merge request -----------------
fast:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH
  before_script:
    - rustup component add rustfmt clippy
    - curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "$CARGO_HOME/bin"
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --all-features -- -D warnings
    - cargo nextest run --workspace --all-features
    - cargo test --workspace --doc --all-features
    - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --all-features

# --- Minimum Supported Rust Version check (library-and-publishing) --------------------------
msrv:
  stage: check
  image: rust:1.98
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH
  script:
    - cargo check --workspace --all-features

# --- Heavy lane — scheduled (nightly) pipelines only -------------------------
# Configure a pipeline schedule (cron "0 3 * * *") in the project's CI/CD
# settings to run these. Both are placeholders wired up as the tracks land.
fuzz:
  stage: heavy
  image: rustlang/rust:nightly
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo install cargo-fuzz
    - cd crates/craft-fuzz && cargo fuzz run wire_decode -- -max_total_time=300

# --- E2E docker-compose cluster over real QUIC + mTLS (Track T, T8/T9) -------
# Builds the craft-node image, mints a shared CA + per-node certs, boots a
# 3-node cluster, and asserts election + failover (run.sh) then network
# partition + heal (chaos.sh). Scheduled so it does not slow the fast lane;
# needs a Docker daemon (dind). The pumba latency scenario is opt-in
# (CRAFT_E2E_PUMBA=1) and left off here since dind lacks a mountable socket.
e2e:
  stage: heavy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    # Published container ports live on the dind daemon host, not localhost.
    CRAFT_E2E_HOST: "docker"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apk add --no-cache bash curl
  script:
    - bash e2e/run.sh
    - bash e2e/chaos.sh
    - bash e2e/cert_renew.sh
    - CRAFT_LINEARIZABILITY_SKIP_SIM=1 CRAFT_E2E_LINEARIZABILITY=1 bash e2e/linearizability.sh

# Seeded craft-sim linearizability sweep (Jepsen-lite phase 1; read-consistency).
linearizability-sim:
  stage: heavy
  image: rust:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - CRAFT_E2E_LINEARIZABILITY=0 bash e2e/linearizability.sh

# --- Redis-backed ActorStateStore integration tests (Track G, actor-state-redis) ------
# Runs the `#[ignore]`d testcontainers tests against a real Redis. Scheduled so
# it does not slow the fast lane; needs a Docker daemon (dind).
store-redis:
  stage: heavy
  image: rust:latest
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo test -p craft-store-redis --features docker-tests -- --ignored

# --- Benchmarks + soak (Track T, T10, testing-strategy) ------------------------------
# The `benchmarks/` crate is a standalone workspace (excluded from the root) so
# criterion never touches the fast lane. Runs on schedule: criterion micro-benches
# (append/apply/deliver) plus a soak over the deterministic simulator.
bench:
  stage: heavy
  image: rust:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo bench --manifest-path benchmarks/Cargo.toml
    - SOAK_SECS=120 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak
    - SOAK_MULTI_SECS=60 cargo run --release --manifest-path benchmarks/Cargo.toml --bin soak_multi_raft

# --- Publish (library-and-publishing) ------------------------------------------------------
# `cargo publish --workspace` resolves intra-workspace path deps locally and
# uploads every crate in dependency order. The dry-run gate runs on tags and on
# schedule; the real publish is a manual button on a `vX.Y.Z` tag pipeline with
# CARGO_REGISTRY_TOKEN configured. See docs/releasing.md.
publish-dry-run:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo publish --workspace --dry-run

publish:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
      when: manual
  script:
    - cargo publish --workspace
