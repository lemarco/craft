[workspace]
resolver = "3"
# Plain `cargo check` / `cargo test` (no --workspace) skips heavy optional crates
# (crafty-ops/opendal, crafty-e2e-client, crafty-store-redis). CI always uses
# `--workspace`. Local fast path: ./scripts/test-fast.sh
default-members = [
    "crates/crafty-proto",
    "crates/crafty-core",
    "crates/crafty-storage",
    "crates/crafty-net",
    "crates/crafty-macros",
    "crates/crafty-actor",
    "crates/crafty-client",
    "crates/crafty-sim",
    "crates/crafty",
    "crates/crafty-test-support",
]
members = [
    "crates/crafty-proto",
    "crates/crafty-core",
    "crates/crafty-storage",
    "crates/crafty-net",
    "crates/crafty-macros",
    "crates/crafty-actor",
    "crates/crafty-client",
    "crates/crafty-store-redis",
    "crates/crafty-dashboard",
    "crates/crafty-http",
    "crates/crafty-sim",
    "crates/crafty",
    "crates/crafty-node",
    "crates/crafty-test-support",
    "crates/crafty-ops",
    "crates/crafty-e2e-client",
    "crates/crafty-e2e-queue-client",
    "crates/crafty-dev-client",
    "crates/crafty-showcase-client",
    "crates/crafty-showcase-common",
    "crates/crafty-backlog-postgres",
]
# `benchmarks/` and `examples/` are standalone crates (own workspace tables) so
# criterion and demo binaries never compile in the fast lane. See backlog T10.
exclude = ["benchmarks", "examples", "crates/crafty-fuzz"]

[workspace.package]
version = "0.5.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/lemarco/craft"
homepage = "https://gitlab.com/lemarco/craft"
authors = ["crafty contributors"]
categories = ["concurrency", "network-programming", "asynchronous"]
keywords = ["raft", "actor", "distributed", "consensus", "cluster"]
readme = "README.md"

# Shared dependency versions (library-and-publishing: synchronized workspace).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "std",
] }
pretty_assertions = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Internal crates referenced by path within the workspace.
crafty-proto = { path = "crates/crafty-proto", version = "0.5.2" }
crafty-core = { path = "crates/crafty-core", version = "0.5.2" }
crafty-storage = { path = "crates/crafty-storage", version = "0.5.2" }
crafty-net = { path = "crates/crafty-net", version = "0.5.2" }
crafty-macros = { path = "crates/crafty-macros", version = "0.5.2" }
crafty-actor = { path = "crates/crafty-actor", version = "0.5.2" }
crafty-client = { path = "crates/crafty-client", version = "0.5.2" }
crafty-store-redis = { path = "crates/crafty-store-redis", version = "0.5.2" }
crafty-dashboard = { path = "crates/crafty-dashboard", version = "0.5.2" }
crafty-http = { path = "crates/crafty-http", version = "0.5.2" }
crafty-sim = { path = "crates/crafty-sim", version = "0.5.2" }
crafty = { path = "crates/crafty", version = "0.5.2" }
crafty-test-support = { path = "crates/crafty-test-support", version = "0.5.2" }
crafty-ops = { path = "crates/crafty-ops", version = "0.5.2" }
crafty-e2e-client = { path = "crates/crafty-e2e-client", version = "0.5.2" }
crafty-e2e-queue-client = { path = "crates/crafty-e2e-queue-client", version = "0.5.2" }
crafty-dev-client = { path = "crates/crafty-dev-client", version = "0.5.2" }
crafty-backlog-postgres = { path = "crates/crafty-backlog-postgres", version = "0.5.2" }

# Lints applied across the workspace (library-and-publishing).
[workspace.lints.rust]
unsafe_code = "forbid"
# Published crates: deny undocumented public items (B-11b).
missing_docs = "deny"

# Faster dev/test compile + faster test runtime (deps optimized, own code debuggable).
[profile.dev]
debug = 1 # line tables only — much faster compile/link than full debuginfo
split-debuginfo = "unpacked" # faster linking on Linux

[profile.dev.package."*"]
opt-level = 3 # optimize dependencies; own crates stay at opt-level 0

[profile.dev.build-override]
opt-level = 0

[profile.test]
inherits = "dev"

[profile.release]
lto = "thin"
