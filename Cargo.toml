[workspace]
resolver = "3"
# Plain `cargo check` / `cargo test` (no --workspace) skips heavy optional crates
# (trembita-tools/opendal, trembita-store-redis). CI always uses `--workspace`.
# Local fast path: ./scripts/test-fast.sh
default-members = [
    "crates/trembita-proto",
    "crates/trembita-core",
    "crates/trembita-storage",
    "crates/trembita-net",
    "crates/trembita-macros",
    "crates/trembita-runtime",
    "crates/trembita-jobs",
    "crates/trembita-events",
    "crates/trembita-actor-store",
    "crates/trembita-client",
    "crates/trembita-sim",
    "crates/trembita",
    "crates/trembita-test-support",
]
members = [
    "crates/trembita-proto",
    "crates/trembita-core",
    "crates/trembita-storage",
    "crates/trembita-net",
    "crates/trembita-macros",
    "crates/trembita-runtime",
    "crates/trembita-jobs",
    "crates/trembita-events",
    "crates/trembita-actor-store",
    "crates/trembita-client",
    "crates/trembita-store-redis",
    "crates/trembita-dashboard",
    "crates/trembita-http",
    "crates/trembita-sim",
    "crates/trembita",
    "crates/trembita-test-support",
    "crates/trembita-tools",
    "crates/trembita-backlog-postgres",
]
# `benchmarks/` and `examples/` are standalone crates (own workspace tables) so
# criterion and demo binaries never compile in the fast lane. See backlog T10.
exclude = ["benchmarks", "examples", "crates/trembita-fuzz"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/lemarco/trembita"
homepage = "https://gitlab.com/lemarco/trembita"
authors = ["trembita contributors"]
categories = ["concurrency", "network-programming", "asynchronous"]
keywords = ["raft", "actor", "distributed", "consensus", "cluster"]
readme = "README.md"

# Shared dependency versions (library-and-publishing: synchronized workspace).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "std",
] }
pretty_assertions = "1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Internal crates referenced by path within the workspace.
trembita-proto = { path = "crates/trembita-proto", version = "0.3.1" }
trembita-core = { path = "crates/trembita-core", version = "0.3.1" }
trembita-storage = { path = "crates/trembita-storage", version = "0.3.1" }
trembita-net = { path = "crates/trembita-net", version = "0.3.1" }
trembita-macros = { path = "crates/trembita-macros", version = "0.3.1" }
trembita-runtime = { path = "crates/trembita-runtime", version = "0.3.1" }
trembita-jobs = { path = "crates/trembita-jobs", version = "0.3.1" }
trembita-events = { path = "crates/trembita-events", version = "0.3.1" }
trembita-actor-store = { path = "crates/trembita-actor-store", version = "0.3.1" }
trembita-client = { path = "crates/trembita-client", version = "0.3.1" }
trembita-store-redis = { path = "crates/trembita-store-redis", version = "0.3.1" }
trembita-dashboard = { path = "crates/trembita-dashboard", version = "0.3.1" }
trembita-http = { path = "crates/trembita-http", version = "0.3.1" }
trembita-sim = { path = "crates/trembita-sim", version = "0.3.1" }
trembita = { path = "crates/trembita", version = "0.3.1" }
trembita-test-support = { path = "crates/trembita-test-support", version = "0.3.1" }
trembita-backlog-postgres = { path = "crates/trembita-backlog-postgres", version = "0.3.1" }

# Lints applied across the workspace (library-and-publishing).
[workspace.lints.rust]
unsafe_code = "forbid"
# Published crates: deny undocumented public items (B-11b).
missing_docs = "deny"

# Faster dev/test compile + faster test runtime (deps optimized, own code debuggable).
[profile.dev]
debug = 1 # line tables only — much faster compile/link than full debuginfo
split-debuginfo = "unpacked" # faster linking on Linux

[profile.dev.package."*"]
opt-level = 3 # optimize dependencies; own crates stay at opt-level 0

[profile.dev.build-override]
opt-level = 0

[profile.test]
inherits = "dev"

[profile.release]
lto = "thin"
