[workspace]
resolver = "3"
# Plain `cargo check` / `cargo test` (no --workspace) skips heavy optional crates
# (trembita-tools/opendal, trembita-store-redis). CI always uses `--workspace`.
# Local fast path: ./scripts/test-fast.sh
default-members = [
    "crates/trembita-proto",
    "crates/trembita-core",
    "crates/trembita-storage",
    "crates/trembita-net",
    "crates/trembita-macros",
    "crates/trembita-runtime",
    "crates/trembita-jobs",
    "crates/trembita-events",
    "crates/trembita-capstore",
    "crates/trembita-client",
    "crates/trembita-sim",
    "crates/trembita",
    "crates/trembita-assembly",
    "crates/trembita-test-support",
    "crates/trembita-test-facade",
    "crates/trembita-test-runtime",
]
members = [
    "crates/trembita-proto",
    "crates/trembita-core",
    "crates/trembita-storage",
    "crates/trembita-net",
    "crates/trembita-macros",
    "crates/trembita-runtime",
    "crates/trembita-jobs",
    "crates/trembita-events",
    "crates/trembita-capstore",
    "crates/trembita-client",
    "crates/trembita-store-redis",
    "crates/trembita-dashboard",
    "crates/trembita-http",
    "crates/trembita-sim",
    "crates/trembita",
    "crates/trembita-assembly",
    "crates/trembita-showcase",
    "crates/trembita-test-support",
    "crates/trembita-test-facade",
    "crates/trembita-test-runtime",
    "crates/trembita-tools",
    "crates/trembita-cli",
    "crates/trembita-backlog-postgres",
    "crates/trembita-events-postgres",
    "crates/trembita-capstore-postgres",
    "crates/trembita-metrics-otlp",
]
# `benchmarks/` and `examples/` are standalone crates (own workspace tables) so
# criterion and demo binaries never compile in the fast lane. See backlog T10.
exclude = ["benchmarks", "examples", "crates/trembita-fuzz"]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/lemarco/trembita"
homepage = "https://gitlab.com/lemarco/trembita"
authors = ["trembita contributors"]
categories = ["concurrency", "network-programming", "asynchronous"]
keywords = ["raft", "actor", "distributed", "consensus", "cluster"]
readme = "README.md"

# Shared dependency versions (library-and-publishing: synchronized workspace).
[workspace.dependencies]
# --- Serialization & errors ---------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"

# --- Logging & tracing --------------------------------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "std",
] }

# --- Async runtime (single tokio feature set — avoids duplicate compiles) -------
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
    "signal",
    "test-util",
] }
tokio-rustls = "0.26"
tokio-stream = "0.1"
futures-util = "0.3"

# --- TLS & hashing ------------------------------------------------------------
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "2"
rcgen = "0.14"
sha2 = "0.11"
hex = "0.4"

# --- HTTP (TCP gateway, ops, product routes) ----------------------------------
http = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
include_dir = "0.7"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# --- QUIC / HTTP3 (cluster wire) ----------------------------------------------
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

# --- WebSocket ----------------------------------------------------------------
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

# --- Embedded & SQL stores ----------------------------------------------------
redb = "4.2.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "json"] }
redis = { version = "1.2.2", features = [
    "tokio-comp",
    "connection-manager",
    "tokio-rustls-comp",
    "tls-rustls",
    "tls-rustls-webpki-roots",
] }

# --- Object storage (upgrade artifacts, static sites) -------------------------
opendal = { version = "0.55", features = [
    "services-s3",
    "services-gcs",
    "services-fs",
] }

# --- Scheduling & time --------------------------------------------------------
cron = "0.15.0"
chrono = "0.4"

# --- OpenTelemetry ------------------------------------------------------------
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", default-features = false }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.32"

# --- CLI & ops binaries -------------------------------------------------------
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tar = "0.4"
walkdir = "2"

# --- Proc-macros (trembita-macros) -------------------------------------------
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# --- Testing & dev harness ----------------------------------------------------
pretty_assertions = "1"
tempfile = "3"
temp-env = "0.3.6"
trybuild = "1"
proptest = "1"
testcontainers-modules = { version = "0.15.0", features = ["redis"] }

# --- Workspace crates (published trembita-*) ----------------------------------
trembita-proto = { path = "crates/trembita-proto", version = "0.6.2" }
trembita-core = { path = "crates/trembita-core", version = "0.6.2" }
trembita-storage = { path = "crates/trembita-storage", version = "0.6.2" }
trembita-net = { path = "crates/trembita-net", version = "0.6.2" }
trembita-macros = { path = "crates/trembita-macros", version = "0.6.2" }
trembita-runtime = { path = "crates/trembita-runtime", version = "0.6.2" }
trembita-jobs = { path = "crates/trembita-jobs", version = "0.6.2" }
trembita-events = { path = "crates/trembita-events", version = "0.6.2" }
trembita-capstore = { path = "crates/trembita-capstore", version = "0.6.2" }
trembita-capstore-postgres = { path = "crates/trembita-capstore-postgres", version = "0.6.2" }
trembita-client = { path = "crates/trembita-client", version = "0.6.2" }
trembita-store-redis = { path = "crates/trembita-store-redis", version = "0.6.2" }
trembita-dashboard = { path = "crates/trembita-dashboard", version = "0.6.2" }
trembita-http = { path = "crates/trembita-http", version = "0.6.2" }
trembita-sim = { path = "crates/trembita-sim", version = "0.6.2" }
trembita = { path = "crates/trembita", version = "0.6.2" }
trembita-backlog-postgres = { path = "crates/trembita-backlog-postgres", version = "0.6.2" }
trembita-events-postgres = { path = "crates/trembita-events-postgres", version = "0.6.2" }
trembita-cli = { path = "crates/trembita-cli", version = "0.6.2" }
trembita-metrics-otlp = { path = "crates/trembita-metrics-otlp", version = "0.6.2" }

# --- Workspace crates (unpublished, `publish = false`) ------------------------
trembita-assembly = { path = "crates/trembita-assembly", version = "0.6.2" }
trembita-showcase = { path = "crates/trembita-showcase" }
trembita-test-support = { path = "crates/trembita-test-support", version = "0.6.2" }
trembita-test-facade = { path = "crates/trembita-test-facade", version = "0.6.2" }
trembita-test-runtime = { path = "crates/trembita-test-runtime", version = "0.6.2" }
trembita-tools = { path = "crates/trembita-tools" }

# Lints applied across the workspace (library-and-publishing).
[workspace.lints.rust]
unsafe_code = "forbid"
# Published crates: deny undocumented public items (B-11b).
missing_docs = "deny"

# Faster dev/test compile + faster test runtime (deps optimized, own code debuggable).
[profile.dev]
debug = 1 # line tables only — much faster compile/link than full debuginfo
split-debuginfo = "unpacked" # faster linking on Linux

[profile.dev.package."*"]
opt-level = 3 # optimize dependencies; own crates stay at opt-level 0

[profile.dev.build-override]
opt-level = 0

[profile.test]
inherits = "dev"

[profile.release]
lto = "thin"
