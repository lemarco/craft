# cert-manager automation for crafty mTLS (cert-automation)
#
# Prerequisites:
#   - cert-manager installed in the cluster
#   - Secret `crafty-ca` in the same namespace (see README.md)
#
# Apply:
#   kubectl apply -f deploy/kubernetes/cert-manager/
#   kubectl wait --for=condition=Ready certificate/crafty-node-1 certificate/crafty-node-2 certificate/crafty-node-3
#   kubectl apply -f deploy/kubernetes/
#
# Mapping (must stay in sync with StatefulSet `replicas`):
#   Pod crafty-0  →  Secret crafty-tls-0  →  SAN crafty-node-1
#   Pod crafty-1  →  Secret crafty-tls-1  →  SAN crafty-node-2
#   Pod crafty-2  →  Secret crafty-tls-2  →  SAN crafty-node-3
#
# cert-manager writes tls.crt/tls.key into each Secret; the StatefulSet mounts
# them under /etc/crafty/tls-by-ordinal/<ordinal>/. crafty-node hot-reloads when
# kubelet refreshes the mount (CRAFTY_CERT_WATCH_SECS).

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: crafty-ca
spec:
  ca:
    secretName: crafty-ca

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crafty-node-1
  namespace: default
spec:
  secretName: crafty-tls-0
  duration: 720h
  renewBefore: 168h
  commonName: crafty-node-1
  dnsNames:
    - crafty-node-1
  usages:
    - server auth
    - client auth
  issuerRef:
    name: crafty-ca
    kind: ClusterIssuer

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crafty-node-2
  namespace: default
spec:
  secretName: crafty-tls-1
  duration: 720h
  renewBefore: 168h
  commonName: crafty-node-2
  dnsNames:
    - crafty-node-2
  usages:
    - server auth
    - client auth
  issuerRef:
    name: crafty-ca
    kind: ClusterIssuer

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: crafty-node-3
  namespace: default
spec:
  secretName: crafty-tls-2
  duration: 720h
  renewBefore: 168h
  commonName: crafty-node-3
  dnsNames:
    - crafty-node-3
  usages:
    - server auth
    - client auth
  issuerRef:
    name: crafty-ca
    kind: ClusterIssuer
