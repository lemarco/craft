# A 3-node crafty cluster as a StatefulSet (future-work-and-risks item 6, cert-automation).
#
# Why a StatefulSet: crafty nodes have stable identity. Each pod gets a stable
# ordinal name (`crafty-0`, `crafty-1`, `crafty-2`); the crafty-node binary derives
# its node id from that ordinal (`crafty-0` → NodeId(1)) via the downward-API
# `POD_NAME`, so no per-pod configuration is needed. Membership here is static
# (every pod lists all members by their headless-service DNS name); to grow the
# cluster elastically instead, use the DNS-discovery variant noted below.
#
# mTLS (security, cert-automation): cert-manager issues one Certificate per pod ordinal
# (`crafty-tls-0` … `crafty-tls-2` in deploy/kubernetes/cert-manager/). Each pod
# mounts all ordinal Secrets (kubelet keeps them fresh on renew) and selects its
# own via `CRAFTY_CERT_ORDINAL_BASE` + `POD_NAME`. The issued cert SAN must be
# `crafty-node-<id>` where `<id>` = ordinal + 1 (crafty-0 → crafty-node-1).
#
# Prerequisites:
#   1. cert-manager installed
#   2. kubectl apply -f deploy/kubernetes/cert-manager/
#   3. Secret `crafty-ca` populated (see cert-manager/README.md)
#   4. Wait until Certificate resources report Ready
#   5. kubectl apply -f deploy/kubernetes/
#
# Manual/static certs: use explicit CRAFTY_NODE_* paths and a single Secret; see
# docs/certs.md.
#
# Apply:  kubectl apply -f deploy/kubernetes/
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crafty
  labels:
    app: crafty
spec:
  serviceName: crafty-headless
  replicas: 3
  # OrderedReady boots crafty-0 first, so an initial leader can form before the
  # rest come up. Keep `replicas` in sync with Certificate CRs in cert-manager/.
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: crafty
  template:
    metadata:
      labels:
        app: crafty
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: crafty-node
          image: crafty-node:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: quic
              containerPort: 7443
              protocol: UDP
            - name: admin
              containerPort: 8080
              protocol: TCP
          env:
            # POD_NAME must come first: cert paths and node id derive from it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CRAFTY_LISTEN
              value: "0.0.0.0:7443"
            - name: CRAFTY_ADMIN
              value: "0.0.0.0:8080"
            # Static membership: every pod lists all members by stable DNS. Node
            # ids are ordinal + 1. Keep this in sync with `replicas` above.
            - name: CRAFTY_PEERS
              value: >-
                1@crafty-0.crafty-headless:7443,2@crafty-1.crafty-headless:7443,3@crafty-2.crafty-headless:7443
            # cert-manager: pod `crafty-N` reads `/etc/crafty/tls-by-ordinal/N/tls.{crt,key}`.
            - name: CRAFTY_CERT_ORDINAL_BASE
              value: /etc/crafty/tls-by-ordinal
            - name: CRAFTY_CA_CERT
              value: /etc/crafty/ca/tls.crt
            - name: CRAFTY_CERT_WATCH_SECS
              value: "60"
            # --- Elastic alternative (comment out CRAFTY_PEERS above) -----------
            # Bootstrap crafty-0 as a single-node seed that accepts joins, and let
            # crafty-1.. discover peers by DNS and join dynamically (discovery):
            #   - name: CRAFTY_ALLOW_JOIN
            #     value: "1"
            #   - name: CRAFTY_DISCOVERY
            #     value: "dns:crafty:crafty-headless:3:7443"
            # ------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: ca
              mountPath: /etc/crafty/ca
              readOnly: true
            - name: tls-0
              mountPath: /etc/crafty/tls-by-ordinal/0
              readOnly: true
            - name: tls-1
              mountPath: /etc/crafty/tls-by-ordinal/1
              readOnly: true
            - name: tls-2
              mountPath: /etc/crafty/tls-by-ordinal/2
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: ca
          secret:
            secretName: crafty-ca
        - name: tls-0
          secret:
            secretName: crafty-tls-0
        - name: tls-1
          secret:
            secretName: crafty-tls-1
        - name: tls-2
          secret:
            secretName: crafty-tls-2
