# A 3-node craft cluster as a StatefulSet (future-work-and-risks item 6, cert-automation).
#
# Why a StatefulSet: craft nodes have stable identity. Each pod gets a stable
# ordinal name (`craft-0`, `craft-1`, `craft-2`); the craft-node binary derives
# its node id from that ordinal (`craft-0` → NodeId(1)) via the downward-API
# `POD_NAME`, so no per-pod configuration is needed. Membership here is static
# (every pod lists all members by their headless-service DNS name); to grow the
# cluster elastically instead, use the DNS-discovery variant noted below.
#
# mTLS (security, cert-automation): cert-manager issues one Certificate per pod ordinal
# (`craft-tls-0` … `craft-tls-2` in deploy/kubernetes/cert-manager/). Each pod
# mounts all ordinal Secrets (kubelet keeps them fresh on renew) and selects its
# own via `CRAFT_CERT_ORDINAL_BASE` + `POD_NAME`. The issued cert SAN must be
# `craft-node-<id>` where `<id>` = ordinal + 1 (craft-0 → craft-node-1).
#
# Prerequisites:
#   1. cert-manager installed
#   2. kubectl apply -f deploy/kubernetes/cert-manager/
#   3. Secret `craft-ca` populated (see cert-manager/README.md)
#   4. Wait until Certificate resources report Ready
#   5. kubectl apply -f deploy/kubernetes/
#
# Manual/static certs: use explicit CRAFT_NODE_* paths and a single Secret; see
# docs/certs.md.
#
# Apply:  kubectl apply -f deploy/kubernetes/
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: craft
  labels:
    app: craft
spec:
  serviceName: craft-headless
  replicas: 3
  # OrderedReady boots craft-0 first, so an initial leader can form before the
  # rest come up. Keep `replicas` in sync with Certificate CRs in cert-manager/.
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: craft
  template:
    metadata:
      labels:
        app: craft
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: craft-node
          image: craft-node:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: quic
              containerPort: 7443
              protocol: UDP
            - name: admin
              containerPort: 8080
              protocol: TCP
          env:
            # POD_NAME must come first: cert paths and node id derive from it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CRAFT_LISTEN
              value: "0.0.0.0:7443"
            - name: CRAFT_ADMIN
              value: "0.0.0.0:8080"
            # Static membership: every pod lists all members by stable DNS. Node
            # ids are ordinal + 1. Keep this in sync with `replicas` above.
            - name: CRAFT_PEERS
              value: >-
                1@craft-0.craft-headless:7443,2@craft-1.craft-headless:7443,3@craft-2.craft-headless:7443
            # cert-manager: pod `craft-N` reads `/etc/craft/tls-by-ordinal/N/tls.{crt,key}`.
            - name: CRAFT_CERT_ORDINAL_BASE
              value: /etc/craft/tls-by-ordinal
            - name: CRAFT_CA_CERT
              value: /etc/craft/ca/tls.crt
            - name: CRAFT_CERT_WATCH_SECS
              value: "60"
            # --- Elastic alternative (comment out CRAFT_PEERS above) -----------
            # Bootstrap craft-0 as a single-node seed that accepts joins, and let
            # craft-1.. discover peers by DNS and join dynamically (discovery):
            #   - name: CRAFT_ALLOW_JOIN
            #     value: "1"
            #   - name: CRAFT_DISCOVERY
            #     value: "dns:craft:craft-headless:3:7443"
            # ------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: ca
              mountPath: /etc/craft/ca
              readOnly: true
            - name: tls-0
              mountPath: /etc/craft/tls-by-ordinal/0
              readOnly: true
            - name: tls-1
              mountPath: /etc/craft/tls-by-ordinal/1
              readOnly: true
            - name: tls-2
              mountPath: /etc/craft/tls-by-ordinal/2
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: ca
          secret:
            secretName: craft-ca
        - name: tls-0
          secret:
            secretName: craft-tls-0
        - name: tls-1
          secret:
            secretName: craft-tls-1
        - name: tls-2
          secret:
            secretName: craft-tls-2
