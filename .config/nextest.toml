# cargo-nextest — parallel test runner (install: ./scripts/install-dev-tools.sh)
# Docs: https://nexte.st/docs/configuration/

[profile.default]
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 2 }
status-level = "fail"
failure-output = "immediate-final"

# Local fast path (./scripts/test-fast.sh): skip slow integration / proptest sweeps.
[profile.fast]
inherits = "default"
filter = 'not binary(/multi_raft|quic|cert_reload/) & not test(/safety_holds_under_arbitrary_faults/)'

# CI / pre-push: retry flaky network-adjacent tests once.
# test-threads capped — saas-linux-small runners exhaust disk when many heavy
# integration tests link in parallel (trembita + reqwest + TLS stack).
[profile.ci]
inherits = "default"
test-threads = 2
retries = { backoff = "fixed", count = 1, delay = "500ms" }
slow-timeout = { period = "180s", terminate-after = 2 }
