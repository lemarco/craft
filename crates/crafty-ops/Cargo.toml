[package]
name = "crafty-ops"
description = "Operational CLI: snapshot backup/restore for crafty data directories."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "crafty-ops"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
opendal = { version = "0.52", features = ["services-s3", "services-gcs", "services-fs"] }
tar = "0.4"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
walkdir = "2"

[dev-dependencies]
crafty-ops = { path = ".", version = "0.3.0" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
