[package]
name = "crafty"
description = "A distributed Raft + actor framework: one codebase, N nodes, elastic and self-healing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
crafty-proto.workspace = true
crafty-core.workspace = true
crafty-storage.workspace = true
crafty-net.workspace = true
crafty-actor.workspace = true
crafty-client.workspace = true
crafty-macros.workspace = true
crafty-dashboard.workspace = true
crafty-http = { workspace = true, optional = true }
axum = { version = "0.8", features = ["json", "ws"], optional = true }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "signal"] }
thiserror.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[features]
# Convenience helpers to mint a dev cluster CA + per-node identities. Not for
# production (operators provide real certs). Forwards to `crafty-net/dev-certs`.
dev-certs = ["crafty-net/dev-certs"]
# Dev-only: switch the entire wire to human-readable JSON (future-work-and-risks item 4).
# Forwards to `crafty-proto/json-wire`; never enable in production.
json-wire = ["crafty-proto/json-wire"]
# Product HTTP helpers (`POST /jobs/{stream}`) via optional `crafty-http` crate.
http-jobs = ["dep:crafty-http", "dep:axum"]

[dev-dependencies]
crafty-http.workspace = true
axum = { version = "0.8", features = ["json", "ws"] }
tower = { version = "0.5", features = ["util"] }
crafty-test-support = { path = "../crafty-test-support", features = ["facade"] }
rcgen = "0.14"
rustls-pemfile = "2"
tempfile = "3"
tokio-rustls = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "test-util"] }
serde = { workspace = true, features = ["derive"] }
# The QUIC/mTLS integration test mints a shared dev cluster CA.
crafty-net = { workspace = true, features = ["dev-certs"] }

[[test]]
name = "http_gateway"
path = "tests/http_gateway.rs"
required-features = ["http-jobs"]

[[test]]
name = "http_jobs"
path = "tests/http_jobs.rs"
required-features = ["http-jobs"]
