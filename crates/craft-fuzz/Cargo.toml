# Fuzz targets for craft wire decoders (backlog T4). Standalone crate — run
# `cargo fuzz` from this directory (see README.md).
[package]
name = "craft-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
craft-proto = { path = "../craft-proto" }
