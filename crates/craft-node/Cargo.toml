[package]
name = "craft-node"
description = "Reference binary that runs a craft cluster node from env/CLI config."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[[bin]]
name = "craft-node"
path = "src/main.rs"

[dependencies]
craft = { workspace = true, features = ["dev-certs"] }
craft-actor.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
temp-env = "0.3.6"
tempfile = "3"
