[package]
name = "craft-client"
description = "In-process and remote (HTTP/3) client API for craft."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
craft-proto.workspace = true
craft-core.workspace = true
craft-net.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
craft-actor.workspace = true
craft-test-support.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
