[package]
name = "crafty-test-support"
description = "Shared KV fixtures and cluster harness helpers for crafty integration tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Pulls the full `crafty` facade (dashboard/hyper stack). Enable only in `crafty` tests.
facade = ["dep:crafty"]

[dependencies]
crafty-proto.workspace = true
crafty-core.workspace = true
crafty-actor.workspace = true
crafty = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
pretty_assertions.workspace = true
tokio = { version = "1", features = ["time", "test-util", "rt", "macros"] }
