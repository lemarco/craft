[package]
name = "craft-actor"
description = "Actor runtime, registry, and cluster supervision for craft."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
craft-proto.workspace = true
craft-core.workspace = true
craft-storage.workspace = true
craft-net.workspace = true
craft-macros.workspace = true
serde = { workspace = true, features = ["derive"] }
postcard.workspace = true
redb = "2"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
craft-test-support.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
trybuild = "1"
