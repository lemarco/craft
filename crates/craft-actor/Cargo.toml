[package]
name = "craft-actor"
description = "Actor runtime, registry, and cluster supervision for craft."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
craft-proto.workspace = true
craft-core.workspace = true
craft-storage.workspace = true
craft-net.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
