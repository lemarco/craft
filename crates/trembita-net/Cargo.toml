[package]
name = "trembita-net"
description = "HTTP/3 (QUIC) transport with mTLS for the trembita framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
# Self-signed cluster CA + node cert generation (rcgen). Enable for dev/tests
# (`trembita-node`, `trembita` integration tests); production supplies real certs.
dev-certs = ["dep:rcgen"]

[dependencies]
trembita-proto.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
quinn.workspace = true
rustls.workspace = true
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
bytes.workspace = true
tokio.workspace = true
rustls-pemfile.workspace = true
rcgen = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "tls"
path = "tests/tls.rs"
required-features = ["dev-certs"]

[[test]]
name = "quic"
path = "tests/quic.rs"
required-features = ["dev-certs"]
