[package]
name = "trembita-showcase"
description = "Maintainer harnesses (custom state machines, soaks) — not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
trembita = { workspace = true, features = ["http-jobs", "dev-certs"] }
trembita-assembly.workspace = true
trembita-macros.workspace = true
trembita-runtime.workspace = true
trembita-net = { workspace = true, features = ["dev-certs"] }
hyper.workspace = true
hyper-util.workspace = true
tokio.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["http-jobs", "dev-certs"]
http-jobs = ["trembita/http-jobs"]
dev-certs = ["trembita/dev-certs", "trembita-net/dev-certs"]

[[bin]]
name = "showcase-migrate-demo"
path = "src/bin/showcase_migrate_demo.rs"

[[bin]]
name = "showcase-self-update"
path = "src/bin/showcase_self_update.rs"
required-features = ["http-jobs"]
