[package]
name = "craft-store-redis"
description = "Redis-backed ActorStateStore for stateful craft actors (ADR 021)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
craft-actor.workspace = true
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
testcontainers-modules = { version = "0.13.0", features = ["redis"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
