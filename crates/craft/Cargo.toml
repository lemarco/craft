[package]
name = "craft"
description = "A distributed Raft + actor framework: one codebase, N nodes, elastic and self-healing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
craft-proto.workspace = true
craft-core.workspace = true
craft-storage.workspace = true
craft-net.workspace = true
craft-actor.workspace = true
craft-client.workspace = true
craft-macros.workspace = true
craft-dashboard.workspace = true
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
thiserror.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[features]
# Convenience helpers to mint a dev cluster CA + per-node identities. Not for
# production (operators provide real certs). Forwards to `craft-net/dev-certs`.
dev-certs = ["craft-net/dev-certs"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
serde = { workspace = true, features = ["derive"] }
# The QUIC/mTLS integration test mints a shared dev cluster CA.
craft-net = { workspace = true, features = ["dev-certs"] }
