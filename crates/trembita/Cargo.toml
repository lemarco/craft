[package]
name = "trembita"
description = "A distributed Raft + actor framework: one codebase, N nodes, elastic and self-healing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
trembita-assembly.workspace = true
trembita-proto.workspace = true
trembita-core.workspace = true
trembita-storage.workspace = true
trembita-net.workspace = true
trembita-runtime.workspace = true
trembita-jobs.workspace = true
trembita-events.workspace = true
trembita-capstore.workspace = true
trembita-client.workspace = true
trembita-macros.workspace = true
trembita-dashboard.workspace = true
trembita-http = { workspace = true, optional = true }
trembita-gateway-auth = { workspace = true, optional = true }
trembita-schedule-postgres = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
trembita-store-redis = { workspace = true, optional = true }
trembita-backlog-postgres = { workspace = true, optional = true }
trembita-events-postgres = { workspace = true, optional = true }
trembita-capstore-postgres = { workspace = true, optional = true }
trembita-gateway-session-postgres = { workspace = true, optional = true }
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tower.workspace = true
tokio-rustls.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustls.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
trembita-metrics-otlp = { workspace = true, optional = true }

[features]
default = ["http-jobs"]
# Convenience helpers to mint a dev cluster CA + per-node identities. Not for
# production (operators provide real certs). Forwards to `trembita-net/dev-certs`.
dev-certs = ["trembita-net/dev-certs", "trembita-assembly/dev-certs"]
# Dev-only: switch the entire wire to human-readable JSON (future-work-and-risks item 4).
# Forwards to `trembita-proto/json-wire`; never enable in production.
json-wire = ["trembita-proto/json-wire"]
# Built-in `/jobs/*`, `/actors/*`, `/workflows/*` gateway routes via `trembita-http`.
# Custom gateway routes (WebSocket, native HTTP) work without this feature.
http-jobs = ["dep:trembita-http", "dep:futures-util", "dep:tokio-tungstenite"]
# Dev OIDC callback helper crate (B-40) — re-exported when enabled.
gateway-auth = ["dep:trembita-gateway-auth", "http-jobs"]
schedule-postgres = ["dep:trembita-schedule-postgres"]
# Redis-backed [`CapStateStore`](trembita_capstore::CapStateStore) for external workflow keys.
redis-store = ["dep:trembita-store-redis"]
# PostgreSQL [`CapStateStore`](trembita_capstore::CapStateStore) adapter.
capstore-postgres = ["dep:trembita-capstore-postgres"]
gateway-session-postgres = ["dep:trembita-gateway-session-postgres", "http-jobs"]
# PostgreSQL [`ExternalBacklog`](trembita_jobs::ExternalBacklog) adapter.
external-backlog = ["dep:trembita-backlog-postgres"]
# PostgreSQL [`EventOutboxSource`](trembita_events::EventOutboxSource) adapter.
domain-outbox = ["dep:trembita-events-postgres"]
# OpenTelemetry metrics export (`init_metrics_with_otlp`); tracing OTLP uses `trembita-runtime/otlp`.
otlp-metrics = ["trembita-runtime/otlp", "dep:trembita-metrics-otlp"]
# All optional integrations — used by docs.rs (`all-features = true`).
full = [
    "http-jobs",
    "gateway-auth",
    "schedule-postgres",
    "redis-store",
    "capstore-postgres",
    "gateway-session-postgres",
    "external-backlog",
    "domain-outbox",
    "otlp-metrics",
]

[dev-dependencies]
trembita-http.workspace = true
reqwest.workspace = true
tower.workspace = true
http-body-util.workspace = true
bytes.workspace = true
hyper.workspace = true
trembita-test-support.workspace = true
trembita-test-runtime.workspace = true
trembita-test-facade.workspace = true
rcgen.workspace = true
rustls-pemfile.workspace = true
tempfile.workspace = true
sha2.workspace = true
hex.workspace = true
tokio-rustls.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
serde = { workspace = true, features = ["derive"] }
# The QUIC/mTLS integration test mints a shared dev cluster CA.
trembita-net = { workspace = true, features = ["dev-certs"] }
[[test]]
name = "gateway_ws"
path = "tests/gateway_ws.rs"

[[test]]
name = "gateway_tls"
path = "tests/gateway_tls.rs"

[[test]]
name = "http_gateway"
path = "tests/http_gateway.rs"
required-features = ["http-jobs"]

[[test]]
name = "http_jobs"
path = "tests/http_jobs.rs"
required-features = ["http-jobs"]

[[test]]
name = "http_actors"
path = "tests/http_actors.rs"
required-features = ["http-jobs"]

[[test]]
name = "gateway_introspect_http"
path = "tests/gateway_introspect_http.rs"
required-features = ["http-jobs"]

[[test]]
name = "app_workflow"
path = "tests/app_workflow.rs"
required-features = ["http-jobs"]

[[test]]
name = "app_cluster"
path = "tests/app_cluster.rs"

[[test]]
name = "rolling_upgrade_proof"
path = "tests/rolling_upgrade_proof.rs"
required-features = ["http-jobs"]
