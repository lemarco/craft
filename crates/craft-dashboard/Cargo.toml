[package]
name = "craft-dashboard"
description = "Live observability dashboard and admin endpoints for craft."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.0"
craft-actor.workspace = true
craft-net.workspace = true
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["net", "io-util", "rt", "sync", "time", "macros"] }
tokio-stream = "0.1.18"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
