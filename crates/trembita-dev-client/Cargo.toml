[package]
name = "trembita-dev-client"
description = "Hands-on demo client for the local 3-node QUIC cluster (Raft + job queue)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "trembita-dev-client"
path = "src/main.rs"

[dependencies]
trembita-client.workspace = true
trembita-net.workspace = true
trembita-proto.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
