[package]
name = "trembita-http"
description = "HTTP helpers for trembita product apps — job enqueue routes and gateway utilities."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["raft", "actor", "jobs", "http", "axum"]
readme = "README.md"
homepage.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
include_dir = "0.7"
mime_guess = "2"
trembita-dashboard.workspace = true
trembita-runtime.workspace = true
trembita-jobs.workspace = true
trembita-actor-store.workspace = true
trembita-core.workspace = true
trembita-proto.workspace = true
http = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "net", "macros", "fs", "io-util"] }
tower = "0.5"
opendal = { version = "0.52", features = ["services-s3"], optional = true }

[features]
default = ["static-s3"]
static-s3 = ["dep:opendal"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
