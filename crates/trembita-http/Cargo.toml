[package]
name = "trembita-http"
description = "HTTP helpers for trembita product apps — job enqueue routes and gateway utilities."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["raft", "actor", "jobs", "http", "axum"]
readme = "README.md"
homepage.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
trembita-actor.workspace = true
trembita-core.workspace = true
trembita-proto.workspace = true
http = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "net", "macros"] }
tower = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
