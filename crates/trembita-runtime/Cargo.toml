[package]
name = "trembita-runtime"
description = "Raft node runtime, actor registry, and cluster supervision for trembita."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
trembita-proto.workspace = true
trembita-core.workspace = true
trembita-storage.workspace = true
trembita-net.workspace = true
trembita-macros.workspace = true
serde = { workspace = true, features = ["derive"] }
postcard.workspace = true
redb.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

[features]
default = []
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
trembita-test-support = { path = "../trembita-test-support" }
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true
tokio.workspace = true
trybuild = "1"
