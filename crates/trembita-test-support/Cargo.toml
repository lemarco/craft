[package]
name = "trembita-test-support"
description = "Shared KV fixtures and cluster harness helpers for trembita integration tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Pulls the full `trembita` facade (dashboard/hyper stack). Enable only in `trembita` tests.
facade = ["dep:trembita"]

[dependencies]
trembita-proto.workspace = true
trembita-core.workspace = true
trembita-actor.workspace = true
trembita = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
pretty_assertions.workspace = true
tokio = { version = "1", features = ["time", "test-util", "rt", "macros"] }
