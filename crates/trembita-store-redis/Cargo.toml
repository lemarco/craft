[package]
name = "trembita-store-redis"
description = "Redis-backed ActorStateStore for stateful trembita actors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
# Docker/testcontainers integration tests (heavy CI lane only).
docker-tests = []

[dependencies]
trembita-actor-store.workspace = true
trembita-core.workspace = true
redis.workspace = true

[dev-dependencies]
testcontainers-modules.workspace = true
tokio.workspace = true
rcgen.workspace = true
tempfile.workspace = true

[[test]]
name = "redis"
path = "tests/redis.rs"
required-features = ["docker-tests"]

[[test]]
name = "tls_docker"
path = "tests/tls_docker.rs"
required-features = ["docker-tests"]
