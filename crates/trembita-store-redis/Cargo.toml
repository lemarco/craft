[package]
name = "trembita-store-redis"
description = "Redis-backed ActorStateStore for stateful trembita actors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"
homepage.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
# Docker/testcontainers integration tests (heavy CI lane only).
docker-tests = []

[dependencies]
trembita-actor-store.workspace = true
trembita-core.workspace = true
redis = { version = "1.2.2", features = [
    "tokio-comp",
    "connection-manager",
    "tokio-rustls-comp",
    "tls-rustls",
    "tls-rustls-webpki-roots",
] }

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", features = ["redis"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
rcgen = "0.14"
tempfile = "3"

[[test]]
name = "redis"
path = "tests/redis.rs"
required-features = ["docker-tests"]

[[test]]
name = "tls_docker"
path = "tests/tls_docker.rs"
required-features = ["docker-tests"]
