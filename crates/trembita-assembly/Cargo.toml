[package]
name = "trembita-assembly"
description = "Internal cluster node assembly for the trembita workspace (not published)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
trembita-proto.workspace = true
trembita-core.workspace = true
trembita-storage.workspace = true
trembita-net.workspace = true
trembita-runtime.workspace = true
trembita-jobs.workspace = true
trembita-events.workspace = true
trembita-actor-store.workspace = true
trembita-client.workspace = true
trembita-dashboard.workspace = true
trembita-http.workspace = true
http.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustls.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
opendal.workspace = true

[features]
default = []
dev-certs = ["trembita-net/dev-certs"]

[dev-dependencies]
tempfile.workspace = true
trembita-test-support = { path = "../trembita-test-support" }
