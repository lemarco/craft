[package]
name = "trembita-e2e-client"
description = "E2E linearizability load generator over live QUIC/mTLS (Jepsen-lite)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "trembita-e2e-client"
path = "src/main.rs"

[dependencies]
trembita-client.workspace = true
trembita-net.workspace = true
trembita-proto.workspace = true
trembita-sim.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
