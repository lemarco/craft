[package]
name = "trembita-tools"
description = "Operational and development binaries for the trembita workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "trembita"
path = "src/bin/trembita.rs"

[[bin]]
name = "trembita-node"
path = "src/bin/node.rs"

[[bin]]
name = "trembita-ops"
path = "src/bin/ops.rs"

[[bin]]
name = "trembita-e2e-client"
path = "src/bin/e2e-client.rs"

[[bin]]
name = "trembita-e2e-queue-client"
path = "src/bin/e2e-queue-client.rs"

[[bin]]
name = "trembita-dev-client"
path = "src/bin/dev-client.rs"

[[bin]]
name = "trembita-showcase-client"
path = "src/bin/showcase-client.rs"

[dependencies]
trembita = { workspace = true, features = ["dev-certs"] }
trembita-runtime.workspace = true
trembita-client.workspace = true
trembita-net.workspace = true
trembita-proto.workspace = true
trembita-sim.workspace = true
clap = { version = "4", features = ["derive"] }
flate2 = "1"
opendal.workspace = true
tar = "0.4"
thiserror.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
walkdir = "2"

[dev-dependencies]
temp-env = "0.3.6"
tempfile.workspace = true
trembita-tools = { path = "." }
