# One-command 3-node realtime cluster (dynamic join — no TREMBITA_NODE_ID).
#
#   cd dev/compose/realtime
#   docker compose up --build
#
# ws://127.0.0.1:8290/ws?user=alice  http://127.0.0.1:8290/dashboard

x-showcase-build: &showcase-build
  build:
    context: ../../..
    dockerfile: examples/realtime/Dockerfile

x-node-env: &node-env
  TREMBITA_CERT_DIR: /certs
  TREMBITA_ALLOW_LEAVE: "1"
  TREMBITA_GRACEFUL_LEAVE: "1"
  RUST_LOG: info,showcase=debug,trembita=info,trembita_net=warn

services:
  certgen:
    <<: *showcase-build
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /certs/ca.pem ]; then
          /app/generate.sh --ca-only --out /certs
          /app/generate.sh --node-id 0 --out /certs --ca /certs/ca.pem --ca-key /certs/ca.key
          for id in 1 2 3; do
            /app/generate.sh --node-id "$$id" --out /certs \
              --ca /certs/ca.pem --ca-key /certs/ca.key
          done
        fi
        ls -1 /certs
    volumes:
      - certs:/certs

  node1:
    <<: *showcase-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-env
      TREMBITA_LISTEN: 0.0.0.0:8290
      TREMBITA_ALLOW_JOIN: "1"
      TREMBITA_DATA_DIR: /data
    volumes:
      - certs:/certs
      - node1-data:/data
    ports:
      - "8290:8290"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8290/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  node2:
    <<: *showcase-build
    depends_on:
      certgen:
        condition: service_completed_successfully
      node1:
        condition: service_healthy
    environment:
      <<: *node-env
      TREMBITA_LISTEN: 0.0.0.0:8291
      TREMBITA_JOIN_SEEDS: 1@node1:8290
      TREMBITA_DATA_DIR: /data
    volumes:
      - certs:/certs
      - node2-data:/data
    ports:
      - "8291:8291"
    restart: on-failure

  node3:
    <<: *showcase-build
    depends_on:
      certgen:
        condition: service_completed_successfully
      node1:
        condition: service_healthy
    environment:
      <<: *node-env
      TREMBITA_LISTEN: 0.0.0.0:8292
      TREMBITA_JOIN_SEEDS: 1@node1:8290
      TREMBITA_DATA_DIR: /data
    volumes:
      - certs:/certs
      - node3-data:/data
    ports:
      - "8292:8292"
    restart: on-failure

volumes:
  certs:
  node1-data:
  node2-data:
  node3-data:
