# One-command 3-node workflows cluster (tier A showcase).
#
#   cd dev/compose/workflows
#   docker compose up --build
#
# Trigger: http://127.0.0.1:8490/workflows/run
# Admin:    http://127.0.0.1:9480/dashboard

x-showcase-build: &showcase-build
  build:
    context: ../../..
    dockerfile: examples/workflows/Dockerfile

x-node-env: &node-env
  CRAFTY_PEERS: "1@node1:7843,2@node2:7853,3@node3:7863"
  CRAFTY_CA_CERT: /certs/ca.pem
  RUST_LOG: info,showcase=debug,crafty=info,crafty_net=warn

services:
  certgen:
    <<: *showcase-build
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /certs/ca.pem ]; then
          /app/generate.sh --ca-only --out /certs
          for id in 1 2 3; do
            /app/generate.sh --node-id "$$id" --out /certs \
              --ca /certs/ca.pem --ca-key /certs/ca.key
          done
        fi
        ls -1 /certs
    volumes:
      - certs:/certs

  node1:
    <<: *showcase-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-env
      CRAFTY_NODE_ID: "1"
      CRAFTY_LISTEN: 0.0.0.0:7843
      CRAFTY_ADMIN: 0.0.0.0:9480
      CRAFTY_GATEWAY: 0.0.0.0:8490
      CRAFTY_GATEWAY_NO_JOBS: "1"
      CRAFTY_GATEWAY_NO_ACTORS: "1"
      CRAFTY_NODE_CERT: /certs/node-1.pem
      CRAFTY_NODE_KEY: /certs/node-1.key
      CRAFTY_DATA_DIR: /data
    volumes:
      - certs:/certs
      - node1-data:/data
    ports:
      - "8490:8490"
      - "9480:9480"

  node2:
    <<: *showcase-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-env
      CRAFTY_NODE_ID: "2"
      CRAFTY_LISTEN: 0.0.0.0:7853
      CRAFTY_ADMIN: 0.0.0.0:9481
      CRAFTY_GATEWAY: 0.0.0.0:8491
      CRAFTY_GATEWAY_NO_JOBS: "1"
      CRAFTY_GATEWAY_NO_ACTORS: "1"
      CRAFTY_NODE_CERT: /certs/node-2.pem
      CRAFTY_NODE_KEY: /certs/node-2.key
      CRAFTY_DATA_DIR: /data
    volumes:
      - certs:/certs
      - node2-data:/data
    ports:
      - "8491:8491"
      - "9481:9481"

  node3:
    <<: *showcase-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-env
      CRAFTY_NODE_ID: "3"
      CRAFTY_LISTEN: 0.0.0.0:7863
      CRAFTY_ADMIN: 0.0.0.0:9482
      CRAFTY_GATEWAY: 0.0.0.0:8492
      CRAFTY_GATEWAY_NO_JOBS: "1"
      CRAFTY_GATEWAY_NO_ACTORS: "1"
      CRAFTY_NODE_CERT: /certs/node-3.pem
      CRAFTY_NODE_KEY: /certs/node-3.key
      CRAFTY_DATA_DIR: /data
    volumes:
      - certs:/certs
      - node3-data:/data
    ports:
      - "8492:8492"
      - "9482:9482"

volumes:
  certs:
  node1-data:
  node2-data:
  node3-data:
