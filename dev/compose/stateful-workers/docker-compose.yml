# One-command 3-node stateful-workers cluster (stateful actor showcase).
#
#   cd dev/compose/stateful-workers
#   docker compose up --build
#
# Cast:  http://127.0.0.1:8190/actors/orders/cast
# Admin: http://127.0.0.1:9280/dashboard

x-showcase-build: &showcase-build
  build:
    context: ../../..
    dockerfile: examples/stateful-workers/Dockerfile

x-node-env: &node-env
  CRAFTY_PEERS: "1@node1:7643,2@node2:7653,3@node3:7663"
  CRAFTY_CA_CERT: /certs/ca.pem
  RUST_LOG: info,showcase=debug,crafty=info,crafty_net=warn

services:
  certgen:
    <<: *showcase-build
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /certs/ca.pem ]; then
          /app/generate.sh --ca-only --out /certs
          for id in 1 2 3; do
            /app/generate.sh --node-id "$$id" --out /certs \
              --ca /certs/ca.pem --ca-key /certs/ca.key
          done
        fi
        ls -1 /certs
    volumes:
      - certs:/certs

  node1:
    <<: *showcase-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-env
      CRAFTY_NODE_ID: "1"
      CRAFTY_LISTEN: 0.0.0.0:7643
      CRAFTY_ADMIN: 0.0.0.0:9280
      CRAFTY_GATEWAY: 0.0.0.0:8190
      CRAFTY_NODE_CERT: /certs/node-1.pem
      CRAFTY_NODE_KEY: /certs/node-1.key
      CRAFTY_DATA_DIR: /data
    volumes:
      - certs:/certs
      - node1-data:/data
    ports:
      - "8190:8190"
      - "9280:9280"

  node2:
    <<: *showcase-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-env
      CRAFTY_NODE_ID: "2"
      CRAFTY_LISTEN: 0.0.0.0:7653
      CRAFTY_ADMIN: 0.0.0.0:9281
      CRAFTY_GATEWAY: 0.0.0.0:8191
      CRAFTY_NODE_CERT: /certs/node-2.pem
      CRAFTY_NODE_KEY: /certs/node-2.key
      CRAFTY_DATA_DIR: /data
    volumes:
      - certs:/certs
      - node2-data:/data
    ports:
      - "8191:8191"
      - "9281:9281"

  node3:
    <<: *showcase-build
    depends_on:
      certgen:
        condition: service_completed_successfully
    environment:
      <<: *node-env
      CRAFTY_NODE_ID: "3"
      CRAFTY_LISTEN: 0.0.0.0:7663
      CRAFTY_ADMIN: 0.0.0.0:9282
      CRAFTY_GATEWAY: 0.0.0.0:8192
      CRAFTY_NODE_CERT: /certs/node-3.pem
      CRAFTY_NODE_KEY: /certs/node-3.key
      CRAFTY_DATA_DIR: /data
    volumes:
      - certs:/certs
      - node3-data:/data
    ports:
      - "8192:8192"
      - "9282:9282"

volumes:
  certs:
  node1-data:
  node2-data:
  node3-data:
