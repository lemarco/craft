# step-ca reference + 3-node trembita cluster (cert-automation)
#
# Quick start:
#   cd dev/step-ca
#   ./bootstrap.sh                 # mint certs/ via generate.sh
#   docker compose up --build      # 3 trembita-node containers + optional step-ca
#
# Hot reload: reissue a node cert, then SIGHUP or wait for TREMBITA_CERT_WATCH_SECS:
#   ./../certs/generate.sh --node-id 1 --out ./certs --ca ./certs/ca.pem --ca-key ./certs/ca.key
#   docker compose kill -s HUP trembita-1
#
# Full step-ca ACME/JWK issuance is documented in docs/certs.md — initialize
# step-ca separately, then replace bootstrap with `step ca certificate …`.

services:
  step-ca:
    image: smallstep/step-ca:latest
    profiles: ["step-ca"]
    ports:
      - "9000:9000"
    volumes:
      - step-ca-data:/home/step
    # Initialize out-of-band: https://smallstep.com/docs/step-ca/installation/

  trembita-1:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: trembita-node:step-ca-demo
    hostname: trembita-1
    environment:
      TREMBITA_NODE_ID: "1"
      TREMBITA_LISTEN: "0.0.0.0:7443"
      TREMBITA_ADMIN: "0.0.0.0:8080"
      TREMBITA_PEERS: "1@trembita-1:7443,2@trembita-2:7443,3@trembita-3:7443"
      TREMBITA_NODE_CERT: /etc/trembita/node.pem
      TREMBITA_NODE_KEY: /etc/trembita/node.key
      TREMBITA_CA_CERT: /etc/trembita/ca.pem
      TREMBITA_CERT_WATCH_SECS: "30"
    volumes:
      - ./certs/node-1.pem:/etc/trembita/node.pem
      - ./certs/node-1.key:/etc/trembita/node.key
      - ./certs/ca.pem:/etc/trembita/ca.pem
    ports:
      - "7441:7443/udp"
      - "8081:8080"

  trembita-2:
    image: trembita-node:step-ca-demo
    hostname: trembita-2
    depends_on:
      - trembita-1
    environment:
      TREMBITA_NODE_ID: "2"
      TREMBITA_LISTEN: "0.0.0.0:7443"
      TREMBITA_ADMIN: "0.0.0.0:8080"
      TREMBITA_PEERS: "1@trembita-1:7443,2@trembita-2:7443,3@trembita-3:7443"
      TREMBITA_NODE_CERT: /etc/trembita/node.pem
      TREMBITA_NODE_KEY: /etc/trembita/node.key
      TREMBITA_CA_CERT: /etc/trembita/ca.pem
      TREMBITA_CERT_WATCH_SECS: "30"
    volumes:
      - ./certs/node-2.pem:/etc/trembita/node.pem
      - ./certs/node-2.key:/etc/trembita/node.key
      - ./certs/ca.pem:/etc/trembita/ca.pem

  trembita-3:
    image: trembita-node:step-ca-demo
    hostname: trembita-3
    depends_on:
      - trembita-2
    environment:
      TREMBITA_NODE_ID: "3"
      TREMBITA_LISTEN: "0.0.0.0:7443"
      TREMBITA_ADMIN: "0.0.0.0:8080"
      TREMBITA_PEERS: "1@trembita-1:7443,2@trembita-2:7443,3@trembita-3:7443"
      TREMBITA_NODE_CERT: /etc/trembita/node.pem
      TREMBITA_NODE_KEY: /etc/trembita/node.key
      TREMBITA_CA_CERT: /etc/trembita/ca.pem
      TREMBITA_CERT_WATCH_SECS: "30"
    volumes:
      - ./certs/node-3.pem:/etc/trembita/node.pem
      - ./certs/node-3.key:/etc/trembita/node.key
      - ./certs/ca.pem:/etc/trembita/ca.pem

volumes:
  step-ca-data:
