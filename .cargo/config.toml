# Local build acceleration (Arch/Linux). See scripts/install-dev-tools.sh for nextest/mold.
#
# NOTE: an exported RUSTFLAGS env var REPLACES the target.rustflags below, it does
# not merge with them -- setting `RUSTFLAGS=-D warnings` silently drops mold and
# invalidates the whole build cache. Put lints in [target.*.rustflags] instead.
#
# Machine-specific build settings (target-dir on a faster disk, sccache,
# incremental) belong in your environment, not here -- this file applies to CI
# and every other clone. See docs: CARGO_TARGET_DIR / RUSTC_WRAPPER / CARGO_INCREMENTAL.

[build]
# Faster incremental rebuilds in dev; disable only when using sccache as rustc-wrapper.
incremental = true
# Uncomment or `export RUSTC_WRAPPER=sccache` for cold-build caching (CI / clean clones).
# rustc-wrapper = "sccache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS: optional faster linker — install `brew install llvm` then uncomment:
# [target.x86_64-apple-darwin]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/llvm/bin/ld64.lld"]
