# Local build acceleration (Arch/Linux). See scripts/install-dev-tools.sh for nextest/mold.
#
# NOTE: an exported RUSTFLAGS env var REPLACES the target.rustflags below, it does
# not merge with them -- setting `RUSTFLAGS=-D warnings` silently drops mold and
# invalidates the whole build cache. Put lints in [target.*.rustflags] instead.
#
# Requires `sccache` on PATH (`cargo install sccache` / scripts/install-dev-tools.sh).
# An exported `RUSTC_WRAPPER` still overrides this — unset it if you need the
# repo config to win: `env -u RUSTC_WRAPPER cargo …`.

[build]
# Force sccache for this repo (works even without ~/.cargo rustc-wrapper).
rustc-wrapper = "sccache"
# Incremental and sccache are incompatible — Rust hit rate stays ~0% otherwise.
incremental = false

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# macOS: optional faster linker — install `brew install llvm` then uncomment:
# [target.x86_64-apple-darwin]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/opt/llvm/bin/ld64.lld"]
